<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eff6ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ch-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#006e2d"/>
    </linearGradient>
    <linearGradient id="ch-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ch-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="ch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Aura -->
  <rect width="80" height="80" rx="20" fill="url(#ch-bg)"/>

  <!-- Pediatric Health Protection Shield (Background Outline) -->
  <path d="M40 12 C 48 15, 60 16, 62 26 C 64 42, 54 58, 40 68 C 26 58, 16 42, 18 26 C 20 16, 32 15, 40 12 Z" 
        stroke="#a7f3d0" stroke-width="1.4" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

  <!-- Child Profile & Pediatric Health Emblem -->
  <g transform="translate(0, 2)">
    <!-- Protective Care / Parent-Doctor Embracing Hand/Wing Curve (Left) -->
    <path d="M22 52 C 22 42, 26 32, 34 26 C 36 24.5, 38 27, 36 29 C 30 34, 28 42, 28 50" 
          stroke="url(#ch-emerald)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Child Head Outline & Soft Forelock -->
    <circle cx="43" cy="31" r="11" fill="#f8fafc" stroke="url(#ch-sky)" stroke-width="2.2" filter="url(#ch-shadow)"/>
    
    <!-- Child Hair tuft (Gentle, professional line) -->
    <path d="M40 20 C 42 17, 47 18, 48 22" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Child Serene Profile Feature -->
    <!-- Peaceful eye curve -->
    <path d="M44 30 C 45 32, 47 32, 48 30" stroke="#001428" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Gentle smile -->
    <path d="M46 36 C 45 37.5, 42 37.5, 41 36" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Child Body / Torso -->
    <path d="M33 55 C 33 46, 37 42, 43 42 C 49 42, 53 46, 53 55" 
          stroke="url(#ch-sky)" stroke-width="2.2" stroke-linecap="round" fill="#f0f9ff"/>

    <!-- Gentle Homeopathic Sweet Globules / Wellness Drops (Right) -->
    <g transform="translate(52, 26)">
      <circle cx="6" cy="4" r="3.5" fill="#fef3c7" stroke="url(#ch-amber)" stroke-width="1.5"/>
      <circle cx="6" cy="4" r="1" fill="#d97706"/>
      <circle cx="10" cy="14" r="2.5" fill="#ecfdf5" stroke="url(#ch-emerald)" stroke-width="1.4"/>
      <circle cx="4" cy="22" r="2" fill="#e0f2fe" stroke="url(#ch-sky)" stroke-width="1.2"/>
    </g>

    <!-- Vitality Sparkles -->
    <path d="M28 20 L 30 20 M 29 19 L 29 21" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="58" cy="16" r="1.5" fill="#10b981"/>
  </g>
</svg>
