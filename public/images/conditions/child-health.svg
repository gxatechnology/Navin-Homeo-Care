<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Child Torso Gradient -->
    <linearGradient id="ch-torso-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- Protective Shield Glow -->
    <radialGradient id="ch-shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="ch-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Protective Pediatric Immunity Shield (Background) -->
  <path d="M50 10 C 62 14, 80 15, 82 30 C 85 54, 70 76, 50 88 C 30 76, 15 54, 18 30 C 20 15, 38 14, 50 10 Z" 
        fill="#f8fafc" stroke="#a7f3d0" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="30" fill="url(#ch-shield-glow)"/>

  <!-- Pediatric Medical Stethoscope forming a Caring Embrace -->
  <g stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" fill="none">
    <!-- Binaural Tubes -->
    <path d="M30 18 C 30 22, 36 28, 42 28 C 48 28, 54 22, 54 18"/>
    <!-- Stethoscope tubing wrapping around child -->
    <path d="M42 28 L 42 40 C 42 56, 24 60, 24 70 C 24 80, 36 82, 48 80 C 60 78, 64 66, 58 58"/>
    <!-- Pediatric Chestpiece with emerald sensor -->
    <circle cx="58" cy="56" r="6" fill="#f0fdf4" stroke="#0284c7" stroke-width="2"/>
    <circle cx="58" cy="56" r="3" fill="#059669"/>
  </g>

  <!-- Child Silhouette & Pediatric Health Features (Centered) -->
  <g transform="translate(0, 2)">
    <!-- Child Head -->
    <circle cx="50" cy="36" r="14" fill="#ffffff" stroke="#0369a1" stroke-width="2.2" filter="url(#ch-shadow)"/>
    
    <!-- Gentle Pediatric Forelock / Hair Line -->
    <path d="M44 24 C 47 21, 54 22, 57 26 C 60 25, 62 28, 61 31" 
          stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Child Facial Features: Peaceful eye & smile (Minimal & dignified) -->
    <path d="M50 35 C 52 38, 56 38, 58 35" stroke="#001428" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M52 42 C 54 44, 57 44, 59 42" stroke="#059669" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Child Shoulders & Torso -->
    <path d="M36 68 C 36 56, 42 50, 50 50 C 58 50, 64 56, 64 68" 
          fill="url(#ch-torso-grad)" stroke="#0369a1" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Gentle Homeopathic Globules / Pediatric Care Nodes -->
    <circle cx="70" cy="38" r="4.5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
    <circle cx="70" cy="38" r="1.5" fill="#d97706"/>

    <circle cx="76" cy="50" r="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  </g>

  <!-- Pediatric Care Sparkles -->
  <path d="M26 28 L 28 28 M 27 27 L 27 29" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="72" cy="24" r="2" fill="#10b981"/>
</svg>
