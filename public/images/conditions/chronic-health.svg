<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Multi-system Vital Glow -->
    <radialGradient id="cr-vital-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cr-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Circadian / Long-Term Wellness Circle -->
  <circle cx="50" cy="50" r="42" stroke="#e2e8f0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="50" cy="50" r="34" fill="url(#cr-vital-aura)"/>

  <!-- Human Full Torso & Head Silhouette (Full-Body System Assessment) -->
  <g transform="translate(0, 2)">
    <!-- Head -->
    <circle cx="50" cy="18" r="9.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>

    <!-- Chronic Headache / Cranial Tension Marker (Amber/Red Top Marker) -->
    <circle cx="50" cy="18" r="4" fill="#fee2e2"/>
    <circle cx="50" cy="18" r="1.8" fill="#ef4444"/>
    <path d="M42 12 L 40 10 M 58 12 L 60 10" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Neck & Shoulders -->
    <path d="M46 27 L 44 32 L 28 36 C 24 37, 24 43, 26 50 C 27 54, 30 54, 32 50 L 34 44 L 34 76 C 34 82, 38 88, 44 88 L 47 88 L 47 62 L 53 62 L 53 88 L 56 88 C 62 88, 66 82, 66 76 L 66 44 L 68 50 C 70 54, 73 54, 74 50 C 76 43, 76 37, 72 36 L 56 32 L 54 27 Z" 
          fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round" filter="url(#cr-shadow)"/>

    <!-- Central Anatomical Heart Organ (Chest) -->
    <path d="M50 36 C 50 32, 44 28, 39 28 C 34 28, 31 32, 31 37 C 31 44, 40 51, 50 58 C 60 51, 69 44, 69 37 C 69 32, 66 28, 61 28 C 56 28, 50 32, 50 36 Z" 
          fill="#fff1f2" stroke="#e11d48" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Steady ECG / Vital Health Rhythm Pulse Line Across Body -->
    <path d="M12 46 L 26 46 L 31 38 L 38 56 L 46 36 L 53 50 L 58 46 L 88 46" 
          stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Metabolic / Digestion Fatigue Symptom Marker (Abdomen) -->
    <circle cx="50" cy="58" r="4.5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <circle cx="50" cy="58" r="1.8" fill="#d97706"/>

    <!-- Lumbar / Mobility Chronic Node (Lower Spine) -->
    <circle cx="50" cy="69" r="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <circle cx="50" cy="69" r="1.2" fill="#0369a1"/>
  </g>

  <!-- Vital Rejuvenation Sparkles -->
  <circle cx="18" cy="24" r="2" fill="#10b981"/>
  <circle cx="82" cy="24" r="2" fill="#0284c7"/>
  <circle cx="80" cy="74" r="1.8" fill="#f59e0b"/>
</svg>
