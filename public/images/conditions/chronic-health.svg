<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="cr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eff6ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cr-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cr-heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="cr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Aura -->
  <rect width="80" height="80" rx="20" fill="url(#cr-bg)"/>

  <!-- Holistic Vitality Renewal Ring (Circadian / Long-Term Wellness Circle) -->
  <circle cx="40" cy="40" r="28" stroke="#a7f3d0" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="40" cy="40" r="33" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- Anatomical / Holistic Heart Silhouette (Upper Center) -->
  <g transform="translate(0, -2)">
    <path d="M40 28 C 40 24, 34 20, 29 20 C 23.5 20, 20 24.5, 20 30 C 20 38, 29 46, 40 54 C 51 46, 60 38, 60 30 C 60 24.5, 56.5 20, 51 20 C 46 20, 40 24, 40 28 Z" 
          fill="#fff1f2" stroke="url(#cr-heart)" stroke-width="2.2" stroke-linejoin="round" filter="url(#cr-shadow)"/>

    <!-- Aorta & Pulmonary Vessles Stylized Tops -->
    <path d="M37 20 C 37 16, 41 14, 44 14" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 20 L 43 17" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>

    <!-- Steady ECG / Vital Health Rhythm Pulse Line Across Heart -->
    <path d="M12 40 L 25 40 L 29 32 L 34 47 L 39 34 L 43 43 L 46 40 L 68 40" 
          stroke="url(#cr-pulse)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Vital Energy Center Node -->
    <circle cx="40" cy="38" r="2.5" fill="#059669"/>
    <circle cx="40" cy="38" r="5" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Constitutional Balance Balance Axis (Bottom Harmony) -->
  <g transform="translate(0, 8)" opacity="0.85">
    <path d="M26 56 Q 40 60 54 56" stroke="#006e2d" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="26" cy="56" r="2" fill="#059669"/>
    <circle cx="54" cy="56" r="2" fill="#0284c7"/>
    <circle cx="40" cy="58.5" r="2.5" fill="#001428"/>
  </g>

  <!-- Rejuvenation Sparkles -->
  <circle cx="18" cy="20" r="1.5" fill="#10b981"/>
  <circle cx="62" cy="20" r="1.5" fill="#0284c7"/>
</svg>
