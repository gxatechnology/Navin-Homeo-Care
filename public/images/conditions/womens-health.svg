<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Uterus Body Gradient -->
    <linearGradient id="wh-uterus-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <!-- Hormonal Harmony Aura -->
    <radialGradient id="wh-vital-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="wh-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#db2777" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Female Hormonal Wellness Ring -->
  <circle cx="50" cy="50" r="38" stroke="#fce7f3" stroke-width="1.6" stroke-dasharray="3 4"/>
  <circle cx="50" cy="50" r="32" fill="url(#wh-vital-glow)"/>

  <!-- Clinical Anatomical Structure: Uterus, Fallopian Tubes & Ovaries -->
  <g transform="translate(0, 4)">
    <!-- Left Fallopian Tube & Ovary -->
    <path d="M50 36 C 38 34, 26 26, 20 32 C 15 37, 18 45, 26 43 C 31 42, 39 44, 43 51" 
          stroke="#059669" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Left Ovary with Follicular Nodes -->
    <ellipse cx="20" cy="38" rx="6" ry="4.5" fill="#fff1f2" stroke="#db2777" stroke-width="2"/>
    <circle cx="18" cy="37" r="1.5" fill="#db2777"/>
    <circle cx="22" cy="39" r="1.2" fill="#e11d48"/>

    <!-- Right Fallopian Tube & Ovary -->
    <path d="M50 36 C 62 34, 74 26, 80 32 C 85 37, 82 45, 74 43 C 69 42, 61 44, 57 51" 
          stroke="#059669" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Right Ovary with Follicular Nodes -->
    <ellipse cx="80" cy="38" rx="6" ry="4.5" fill="#fff1f2" stroke="#db2777" stroke-width="2"/>
    <circle cx="82" cy="37" r="1.5" fill="#db2777"/>
    <circle cx="78" cy="39" r="1.2" fill="#e11d48"/>

    <!-- Uterus Anatomical Organ (Fundus, Corpus, Cervix) -->
    <path d="M41 33 C 46 31, 54 31, 59 33 C 65 38, 63 54, 56 66 C 53.5 70, 46.5 70, 44 66 C 37 54, 35 38, 41 33 Z" 
          fill="url(#wh-uterus-grad)" stroke="#db2777" stroke-width="2.6" stroke-linejoin="round" filter="url(#wh-shadow)"/>

    <!-- Endometrium / Inner Uterine Cavity & Hormonal Vitality Center -->
    <path d="M50 40 C 46 45, 46 54, 50 59 C 54 54, 54 45, 50 40 Z" 
          fill="#db2777" opacity="0.85"/>
    <circle cx="50" cy="49" r="2.5" fill="#ffffff"/>

    <!-- Delicate Endometrial Waves -->
    <path d="M46 47 C 43 49, 44 53, 47 54" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M54 47 C 57 49, 56 53, 53 54" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cervical Canal & Vaginal Axis -->
    <path d="M47 69 L 47 78 M 53 69 L 53 78" stroke="#be185d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M44 78 C 47 80, 53 80, 56 78" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vitality & Rejuvenation Wellness Sparkles -->
  <path d="M34 18 L 36 18 M 35 17 L 35 19" stroke="#db2777" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M66 18 L 68 18 M 67 17 L 67 19" stroke="#059669" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="50" cy="14" r="2" fill="#ec4899"/>
</svg>
