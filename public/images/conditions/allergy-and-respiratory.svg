<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Lung Left Gradient -->
    <linearGradient id="ar-lung-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <!-- Lung Right Gradient -->
    <linearGradient id="ar-lung-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- Allergy Pollen Flare -->
    <radialGradient id="ar-pollen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="ar-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left: Nasal Profile & Airway Entry (Upper Left Profile) -->
  <path d="M18 10 C 24 10, 28 14, 28 20 C 30 22, 33 24, 30 27 C 27 29, 23 28, 20 30 C 18 32, 19 36, 17 38" 
        stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Inhaled Airflow Stream with Allergy / Pollen Micro-Particles -->
  <g opacity="0.9">
    <!-- Air stream lines flowing into nose -->
    <path d="M4 22 C 10 20, 18 24, 24 26" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/>
    <path d="M6 28 C 12 26, 18 28, 23 30" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Allergy Pollen Particles (Amber/Red Irritants) -->
    <!-- Particle 1 with pollen spikes -->
    <circle cx="8" cy="16" r="3" fill="#f59e0b"/>
    <path d="M8 11 L 8 21 M 3 16 L 13 16 M 4.5 12.5 L 11.5 19.5 M 4.5 19.5 L 11.5 12.5" stroke="#d97706" stroke-width="1"/>

    <!-- Particle 2 (Smaller) -->
    <circle cx="16" cy="18" r="2.2" fill="#ef4444"/>
    <circle cx="12" cy="24" r="1.6" fill="#f59e0b"/>
  </g>

  <!-- Trachea & Larynx (Center Tube) -->
  <g transform="translate(10, 0)">
    <!-- Main Tracheal Tube -->
    <path d="M40 12 L 40 36 C 40 40, 36 45, 30 48" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M44 12 L 44 36 C 44 40, 48 45, 54 48" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Cartilaginous Tracheal Rings -->
    <line x1="39" y1="17" x2="45" y2="17" stroke="#0369a1" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="39" y1="23" x2="45" y2="23" stroke="#0369a1" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="39" y1="29" x2="45" y2="29" stroke="#0369a1" stroke-width="1.6" stroke-linecap="round"/>
    
    <!-- Pharyngeal / Sinus Irritation Glow (Red/Amber Highlight on upper airway) -->
    <circle cx="42" cy="23" r="5" fill="#fee2e2" opacity="0.6"/>
    <circle cx="42" cy="23" r="2" fill="#ef4444"/>

    <!-- Left Anatomical Lung Lobe -->
    <!-- Upper Lobe, Middle Fissure, Lower Base -->
    <path d="M29 48 C 21 48, 11 54, 11 67 C 11 80, 20 86, 30 85 C 36 84.5, 38 78, 38 69 C 38 57, 34 50, 29 48 Z" 
          fill="url(#ar-lung-l)" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" filter="url(#ar-shadow)"/>

    <!-- Right Anatomical Lung Lobe -->
    <path d="M55 48 C 63 48, 73 54, 73 67 C 73 80, 64 86, 54 85 C 48 84.5, 46 78, 46 69 C 46 57, 50 50, 55 48 Z" 
          fill="url(#ar-lung-r)" stroke="#0284c7" stroke-width="2.4" stroke-linejoin="round" filter="url(#ar-shadow)"/>

    <!-- Left Bronchial Tree & Bronchioles -->
    <g stroke="#006e2d" stroke-width="1.6" stroke-linecap="round">
      <path d="M30 53 C 25 58, 21 62, 18 69"/>
      <path d="M24 61 C 21 66, 21 72, 23 77"/>
      <path d="M27 56 C 30 61, 32 68, 30 75"/>
    </g>

    <!-- Right Bronchial Tree & Bronchioles -->
    <g stroke="#0369a1" stroke-width="1.6" stroke-linecap="round">
      <path d="M54 53 C 59 58, 63 62, 66 69"/>
      <path d="M60 61 C 63 66, 63 72, 61 77"/>
      <path d="M57 56 C 54 61, 52 68, 54 75"/>
    </g>

    <!-- Clear Oxygen / Alveolar Vitality Nodes -->
    <circle cx="17" cy="70" r="2" fill="#10b981"/>
    <circle cx="67" cy="70" r="2" fill="#38bdf8"/>
    <circle cx="25" cy="79" r="1.5" fill="#059669"/>
    <circle cx="59" cy="79" r="1.5" fill="#0284c7"/>
  </g>
</svg>
