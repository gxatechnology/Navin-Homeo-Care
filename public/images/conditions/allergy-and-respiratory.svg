<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="ar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ar-trachea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ar-lung-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#006e2d"/>
    </linearGradient>
    <linearGradient id="ar-lung-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="ar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Aura -->
  <rect width="80" height="80" rx="20" fill="url(#ar-bg)"/>

  <!-- Airflow / Clean Breathing Breeze Curves (Upper & Surrounding) -->
  <g opacity="0.4" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round">
    <path d="M12 18 C 18 14, 24 16, 32 14"/>
    <path d="M48 14 C 56 16, 62 14, 68 18"/>
    <path d="M10 24 C 16 22, 22 23, 28 22" stroke-dasharray="2 3"/>
    <path d="M52 22 C 58 23, 64 22, 70 24" stroke-dasharray="2 3"/>
  </g>

  <!-- Main Trachea & Larynx -->
  <g transform="translate(0, 4)">
    <!-- Trachea tube with cartilaginous rings -->
    <path d="M38 10 L 38 28 C 38 32, 34 36, 30 38" stroke="url(#ar-trachea)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M42 10 L 42 28 C 42 32, 46 36, 50 38" stroke="url(#ar-trachea)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tracheal rings -->
    <line x1="37" y1="14" x2="43" y2="14" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="19" x2="43" y2="19" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="24" x2="43" y2="24" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Lung Anatomical Lobe -->
    <path d="M30 38 C 24 38, 16 43, 16 53 C 16 63, 22 68, 30 67 C 34 66.5, 36 62, 36 55 C 36 46, 33 40, 30 38 Z" 
          fill="#ecfdf5" stroke="url(#ar-lung-left)" stroke-width="2.2" stroke-linejoin="round" filter="url(#ar-shadow)"/>

    <!-- Right Lung Anatomical Lobe -->
    <path d="M50 38 C 56 38, 64 43, 64 53 C 64 63, 58 68, 50 67 C 46 66.5, 44 62, 44 55 C 44 46, 47 40, 50 38 Z" 
          fill="#f0f9ff" stroke="url(#ar-lung-right)" stroke-width="2.2" stroke-linejoin="round" filter="url(#ar-shadow)"/>

    <!-- Internal Bronchial Tree Branches (Left) -->
    <g stroke="#059669" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
      <path d="M31 43 C 27 47, 24 50, 22 55"/>
      <path d="M26 49 C 24 53, 24 58, 26 61"/>
      <path d="M28 45 C 31 49, 32 54, 31 59"/>
    </g>

    <!-- Internal Bronchial Tree Branches (Right) -->
    <g stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
      <path d="M49 43 C 53 47, 56 50, 58 55"/>
      <path d="M54 49 C 56 53, 56 58, 54 61"/>
      <path d="M52 45 C 49 49, 48 54, 49 59"/>
    </g>

    <!-- Alveolar Health Sparkles / Clear Oxygen Glow -->
    <circle cx="21" cy="56" r="1.5" fill="#10b981"/>
    <circle cx="59" cy="56" r="1.5" fill="#38bdf8"/>
    <circle cx="27" cy="62" r="1.2" fill="#059669"/>
    <circle cx="53" cy="62" r="1.2" fill="#0284c7"/>
  </g>
</svg>
