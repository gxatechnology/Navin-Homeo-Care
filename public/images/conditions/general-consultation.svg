<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Consultation Shield Gradient -->
    <linearGradient id="gc-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="gc-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Physician Consultation & Diagnosis Shield (Background) -->
  <path d="M50 8 C 64 12, 84 13, 86 28 C 88 56, 74 78, 50 92 C 26 78, 12 56, 14 28 C 16 13, 36 12, 50 8 Z" 
        fill="url(#gc-shield-grad)" stroke="#cbd5e1" stroke-width="1.8" filter="url(#gc-shadow)"/>

  <!-- Clinical Cross of Medical Care -->
  <g transform="translate(50, 42)">
    <rect x="-4" y="-16" width="8" height="32" rx="3" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="-16" y="-4" width="32" height="8" rx="3" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#006e2d"/>
  </g>

  <!-- Complete Clinical Stethoscope Visual (Front & Center Diagnostic Tool) -->
  <g stroke="#0284c7" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- Binaural Headset Arch -->
    <path d="M30 16 C 30 22, 38 30, 44 30 C 50 30, 50 26, 50 26"/>
    <path d="M70 16 C 70 22, 62 30, 56 30 C 50 30, 50 26, 50 26"/>
    
    <!-- Eartips -->
    <circle cx="30" cy="16" r="2.5" fill="#001428" stroke="none"/>
    <circle cx="70" cy="16" r="2.5" fill="#001428" stroke="none"/>

    <!-- Y-Joint Tubing Downward -->
    <path d="M50 28 L 50 44"/>

    <!-- Flexible Acoustic Tube Loop -->
    <path d="M50 44 C 50 62, 28 66, 28 76 C 28 85, 42 88, 58 84 C 74 80, 78 66, 70 56"/>

    <!-- Stethoscope Diaphragm Chestpiece -->
    <circle cx="70" cy="54" r="8.5" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.6"/>
    <circle cx="70" cy="54" r="4.5" fill="#059669" stroke="none"/>
    <circle cx="70" cy="54" r="1.5" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Medical Assessment Checkmark / Diagnosis Verified Badge -->
  <g transform="translate(24, 48)">
    <circle cx="6" cy="6" r="7.5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <path d="M3 6.5 L 5.5 9 L 9.5 3.5" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Clarity Sparkles -->
  <circle cx="24" cy="24" r="2" fill="#10b981"/>
  <circle cx="78" cy="24" r="2" fill="#0284c7"/>
</svg>
