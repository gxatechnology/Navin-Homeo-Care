<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="gc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gc-steth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gc-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#006e2d"/>
    </linearGradient>
    <filter id="gc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Aura -->
  <rect width="80" height="80" rx="20" fill="url(#gc-bg)"/>

  <!-- Clinical Shield (Background Outline) -->
  <path d="M40 14 C 49 17, 59 17, 60 27 C 62 43, 53 58, 40 66 C 27 58, 18 43, 20 27 C 21 17, 31 17, 40 14 Z" 
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" opacity="0.9"/>

  <!-- Medical Cross of Care (Inside Shield) -->
  <g transform="translate(40, 34)">
    <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#ecfdf5" stroke="url(#gc-emerald)" stroke-width="1.6"/>
    <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#ecfdf5" stroke="url(#gc-emerald)" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="2" fill="#006e2d"/>
  </g>

  <!-- Physician Stethoscope (Overlaid Clinical Diagnostic Tool) -->
  <g transform="translate(0, 4)">
    <!-- Earpieces / Binaural Spring Tubes -->
    <path d="M26 15 C 26 18, 30 25, 34 25 C 38 25, 38 22, 38 22" stroke="url(#gc-steth)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M54 15 C 54 18, 50 25, 46 25 C 42 25, 42 22, 42 22" stroke="url(#gc-steth)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Eartips -->
    <circle cx="26" cy="15" r="2" fill="#001428"/>
    <circle cx="54" cy="15" r="2" fill="#001428"/>

    <!-- Y-Joint Tubing -->
    <path d="M40 23 L 40 33" stroke="url(#gc-steth)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Flexible Tubing Loop downwards and up to chest piece -->
    <path d="M40 33 C 40 46, 25 50, 25 57 C 25 64, 34 66, 44 64 C 54 62, 57 52, 53 45" 
          stroke="url(#gc-steth)" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- Stethoscope Bell / Diaphragm Chestpiece -->
    <circle cx="53" cy="43" r="6.5" fill="#f0f9ff" stroke="url(#gc-steth)" stroke-width="2.2" filter="url(#gc-shadow)"/>
    <circle cx="53" cy="43" r="3.5" fill="#059669"/>
    <circle cx="53" cy="43" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Diagnostic Clarity Sparkles -->
  <circle cx="22" cy="28" r="1.5" fill="#10b981"/>
  <circle cx="60" cy="28" r="1.5" fill="#0284c7"/>
</svg>
