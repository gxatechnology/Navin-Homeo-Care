<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Soft pain radial glow -->
    <radialGradient id="jp-pain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#fee2e2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fee2e2" stop-opacity="0"/>
    </radialGradient>
    <!-- Spine Gradient -->
    <linearGradient id="jp-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="jp-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001428" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Human Back Silhouette (Neck, Shoulders, Spine, Lower Back, Pelvis) -->
  <!-- Neck & Shoulders -->
  <path d="M42 8 C 42 12, 36 15, 26 20 C 20 23, 18 29, 21 38 C 23 45, 27 52, 28 62 C 29 72, 25 80, 24 88 C 24 92, 32 94, 50 94 C 68 94, 76 92, 76 88 C 75 80, 71 72, 72 62 C 73 52, 77 45, 79 38 C 82 29, 80 23, 74 20 C 64 15, 58 12, 58 8 Z" 
        fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6" filter="url(#jp-drop)"/>

  <!-- Shoulder Blade Outlines (Scapula) -->
  <path d="M28 26 C 34 25, 39 31, 38 42 C 37 47, 33 49, 30 46" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M72 26 C 66 25, 61 31, 62 42 C 63 47, 67 49, 70 46" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Radiating Lumbar / Lower Back Pain Flare Area -->
  <circle cx="50" cy="65" r="22" fill="url(#jp-pain)"/>
  <!-- Concentric Pain Waves -->
  <path d="M36 60 C 33 63, 33 67, 36 70" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M31 57 C 27 62, 27 68, 31 73" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7"/>
  <path d="M64 60 C 67 63, 67 67, 64 70" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M69 57 C 73 62, 73 68, 69 73" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7"/>

  <!-- Anatomical Vertebral Spinal Column -->
  <!-- Cervical Vertebrae (C1-C7) -->
  <rect x="45.5" y="12" width="9" height="3.5" rx="1.5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="45" y="17" width="10" height="3.8" rx="1.6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="44.5" y="22.5" width="11" height="4" rx="1.8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>

  <!-- Thoracic Vertebrae (T1-T12 mid-back) -->
  <rect x="44" y="28.5" width="12" height="4.5" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="35" width="12" height="4.5" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="43.5" y="41.5" width="13" height="4.8" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="43" y="48" width="14" height="5" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Lumbar Vertebrae (L1-L5 Pain Focus Region) -->
  <rect x="42.5" y="55" width="15" height="5.5" rx="2.2" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <circle cx="50" cy="57.7" r="1.5" fill="#ef4444"/>

  <rect x="42" y="62.5" width="16" height="6" rx="2.4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="50" cy="65.5" r="2.2" fill="#dc2626"/>

  <rect x="41.5" y="70.5" width="17" height="6" rx="2.4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <circle cx="50" cy="73.5" r="1.5" fill="#ef4444"/>

  <!-- Sacrum / Pelvis Base -->
  <path d="M41 78.5 L 59 78.5 L 54 89 L 46 89 Z" fill="#e2e8f0" stroke="#0369a1" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="50" y1="80" x2="50" y2="87" stroke="#0369a1" stroke-width="1.4"/>
</svg>
