<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="dg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="dg-stomach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#006e2d"/>
    </linearGradient>
    <linearGradient id="dg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="dg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Aura -->
  <rect width="80" height="80" rx="20" fill="url(#dg-bg)"/>

  <!-- Esophagus entry -->
  <path d="M38 12 L 38 22 C 38 24, 39 25, 41 26" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Anatomical Stomach Contour -->
  <!-- Fundus (top arch) -> Greater Curvature (large left/bottom curve) -> Pylorus -> Duodenum (right turn) -->
  <path d="M41 24 C 47 22, 56 25, 56 34 C 56 46, 45 56, 33 56 C 24 56, 20 48, 22 40 C 23 34, 28 30, 36 29 C 39 28.5, 41 27, 41 24 Z" 
        fill="#f0fdf4" stroke="url(#dg-stomach)" stroke-width="2.4" stroke-linejoin="round" filter="url(#dg-shadow)"/>

  <!-- Lesser Curvature inner definition -->
  <path d="M40 31 C 36 34, 34 40, 38 46 C 41 49, 46 48, 48 44" 
        stroke="#10b981" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

  <!-- Duodenum / Intestinal Loop Exit (Bottom Right) -->
  <path d="M48 44 C 53 43, 58 47, 57 53 C 56 59, 49 61, 44 61 C 38 61, 35 64, 35 68" 
        stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 64 C 48 64, 52 65, 54 68" 
        stroke="#059669" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Soothing Gut Balance / Digestive Harmony Waves inside stomach -->
  <g stroke="url(#dg-glow)" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <path d="M29 42 Q 33 39 37 42 T 45 42"/>
    <path d="M31 47 Q 35 44 39 47 T 47 47"/>
  </g>

  <!-- Microbiome / Probiotic Wellness Dots -->
  <circle cx="28" cy="35" r="1.5" fill="#f59e0b"/>
  <circle cx="49" cy="33" r="1.8" fill="#10b981"/>
  <circle cx="34" cy="52" r="1.4" fill="#059669"/>
  <circle cx="44" cy="37" r="1.2" fill="#34d399"/>
  <circle cx="53" cy="50" r="1.3" fill="#f59e0b"/>
</svg>
