<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Skin Dermis Gradient -->
    <linearGradient id="sh-dermis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="40%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <!-- Hair Shaft Gradient -->
    <linearGradient id="sh-hair-shaft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#006e2d"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#001428"/>
    </linearGradient>
    <filter id="sh-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001428" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Left: Anatomical Hair Follicle & Root in Skin Layer -->
  <g transform="translate(4, 0)">
    <!-- Epidermis / Dermis Base Cross Section -->
    <path d="M6 55 C 16 53, 30 54, 46 52 C 48 52, 48 88, 48 88 C 32 90, 18 90, 6 88 Z" 
          fill="url(#sh-dermis)" stroke="#e2e8f0" stroke-width="1.4" filter="url(#sh-glow)"/>
    
    <!-- Dermal Stratum Lines -->
    <path d="M6 62 C 18 61, 32 62, 46 60" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M6 72 C 18 71, 32 72, 46 70" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Hair Follicle Sheath / Bulb in Dermis -->
    <path d="M22 53 C 22 66, 17 74, 20 83 C 22 88, 30 88, 32 83 C 35 74, 30 66, 30 53" 
          fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Hair Papilla / Follicle Root Center (Growth Seed) -->
    <circle cx="26" cy="82" r="3.5" fill="#006e2d"/>
    <circle cx="26" cy="82" r="5.5" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Sebaceous Gland (Oil gland attached to follicle) -->
    <path d="M30 64 C 36 63, 40 67, 37 72 C 34 76, 30 73, 30 70" 
          fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>

    <!-- Main Hair Shaft Emerging and Flowing Upward -->
    <path d="M26 80 C 26 65, 27 50, 24 35 C 21 22, 14 12, 10 6" 
          stroke="url(#sh-hair-shaft)" stroke-width="3" stroke-linecap="round"/>
    <!-- Secondary Hair Strands (Fuller Hair Graphic) -->
    <path d="M28 52 C 30 38, 31 24, 26 12 C 24 8, 20 5, 17 3" 
          stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M23 52 C 22 40, 19 28, 12 18" 
          stroke="#059669" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Right: Clean Face Profile with Skin Care & Acne/Blemish Symptom Marker -->
  <g transform="translate(14, 0)">
    <!-- Facial Profile Line (Forehead, Nose, Lips, Chin, Jawline) -->
    <path d="M52 14 C 58 14, 66 18, 69 25 C 71 29, 70 33, 67 36 C 70 38, 72 42, 69 46 C 67 49, 62 50, 60 52 C 58 55, 60 59, 58 63 C 55 67, 49 69, 44 69" 
          stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh-glow)"/>

    <!-- Cheek Contour -->
    <path d="M56 34 C 62 38, 62 46, 56 52" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>

    <!-- Acne / Skin Blemish Pain & Care Indicator (Red/Orange Highlight) -->
    <circle cx="62" cy="40" r="7" fill="#fee2e2" opacity="0.8"/>
    <circle cx="62" cy="40" r="4.5" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="2" fill="#dc2626"/>

    <!-- Minor secondary irritation dot -->
    <circle cx="56" cy="48" r="2" fill="#ef4444" opacity="0.85"/>

    <!-- Radiant Healthy Skin Sparkles (Dermatology Care Glow) -->
    <path d="M74 24 L 78 24 M 76 22 L 76 26" stroke="#059669" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="78" cy="34" r="1.5" fill="#10b981"/>
    <circle cx="72" cy="54" r="1.5" fill="#0284c7"/>
  </g>
</svg>
