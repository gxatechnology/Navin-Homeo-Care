<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sh-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#006e2d"/>
    </linearGradient>
    <linearGradient id="sh-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sh-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001428"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="sh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <rect width="80" height="80" rx="20" fill="url(#sh-bg)"/>
  
  <!-- Subtle Dermal Cross Section Lines (Bottom Left) -->
  <g opacity="0.35" stroke="#059669" stroke-width="1.2" stroke-linecap="round">
    <path d="M12 60 Q 24 58 36 61 T 60 59" stroke-dasharray="2 3"/>
    <path d="M12 65 Q 24 63 36 66 T 60 64"/>
    <path d="M12 70 Q 24 68 36 71 T 60 69"/>
  </g>

  <!-- Elegant Female / Human Face Profile (Minimalist Clean Medical Line) -->
  <path d="M30 18 C 30 18, 38 18, 41 23 C 43.5 27, 43 31, 41 33 C 43 35, 45 37.5, 43.5 40 C 42 42.5, 38 43, 37 44 C 35.5 45.5, 37.5 48.5, 36 50 C 34.5 51.5, 31 52, 29 52" 
        stroke="url(#sh-emerald)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh-glow)"/>

  <!-- Flowing Healthy Hair Wave -->
  <path d="M30 18 C 24 16, 17 24, 18 34 C 19 44, 23 52, 26 58 C 27 60, 26 62, 24 65" 
        stroke="url(#sh-hair)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 19 C 28 20, 23 27, 23 37 C 23 45, 27 52, 29 57" 
        stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Radiant Hair Follicle & Root Strength Graphic (Right Side) -->
  <g transform="translate(44, 20)">
    <!-- Follicle Bulb / Dermal Papilla -->
    <path d="M14 42 C 11 42, 9 39, 10 35 C 11 30, 15 22, 16 12 C 16.5 7, 18 2, 20 0" 
          stroke="url(#sh-emerald)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 42 C 17 42, 19 39, 18 35 C 17 30, 15 22, 16 12" 
          stroke="url(#sh-accent)" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Bulb Base Node -->
    <circle cx="14" cy="38" r="3.5" fill="#006e2d" opacity="0.85"/>
    <circle cx="14" cy="38" r="6" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

    <!-- Cellular Health Sparkles / Radiance -->
    <path d="M4 14 L 6 14 M 5 13 L 5 15" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M24 18 L 26 18 M 25 17 L 25 19" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="2" cy="24" r="1.5" fill="#34d399"/>
    <circle cx="24" cy="30" r="1.2" fill="#059669"/>
  </g>

  <!-- Soothing Skin Glow Node (Cheek area) -->
  <circle cx="37" cy="36" r="3" fill="#10b981" fill-opacity="0.25"/>
  <circle cx="37" cy="36" r="1.2" fill="#059669"/>
</svg>
